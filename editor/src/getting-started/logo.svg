<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Solder's icon: two wires, one in LabVIEW's floating-point orange and one in its integer
       blue, joined by a bead of solder. Drawn for Solder; not taken from any NI artwork. -->
  <defs>
    <radialGradient id="bead" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#d9dee3"/>
      <stop offset="1" stop-color="#7d868f"/>
    </radialGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="52" fill="#1d2733"/>
  <path d="M 30 168 H 128" stroke="#ff7f00" stroke-width="22" stroke-linecap="round" fill="none"/>
  <path d="M 128 168 V 84 H 206" stroke="#2f6fff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <rect x="190" y="56" width="44" height="56" rx="8" fill="#f2f2f2" stroke="#9aa3ab" stroke-width="4"/>
  <circle cx="128" cy="168" r="36" fill="url(#bead)" stroke="#5f676f" stroke-width="4"/>
</svg>
