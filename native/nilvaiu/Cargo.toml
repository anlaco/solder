[package]
name = "nilvaiu"
version = "0.1.0"
description = "Solder's stand-in for NI's nilvaiu: the functions DAQmx's VIs call, over Solder's DAQ engine (DT-087)."
edition.workspace = true
license.workspace = true
publish.workspace = true

# A library that is loaded by its path, as NI's is: `nilvaiu.dll`, `libnilvaiu.so`.
[lib]
crate-type = ["cdylib"]

[dependencies]
solder-daq = { path = "../solder-daq" }

[dev-dependencies]
solder-io = { path = "../solder-io" }
